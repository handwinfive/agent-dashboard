<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workbench — 에이전트 업무 대시보드</title>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- SortableJS for drag & drop -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<!-- Agent Registry (정의·프롬프트·UI) -->
<script src="agents.js"></script>

<style>
/* ======================================================
   THEME VARIABLES
   ====================================================== */
:root {
  /* Dark theme (default) */
  --bg-primary: #0f0f12;
  --bg-secondary: #1a1a22;
  --bg-tertiary: #24242f;
  --bg-card: #1e1e28;
  --bg-hover: #2a2a38;
  --bg-input: #24242f;
  --border-color: #2e2e3e;
  --border-light: #3a3a4e;
  --text-primary: #e8e8ed;
  --text-secondary: #9898a8;
  --text-muted: #6e6e80;
  --accent: #7c5cfc;
  --accent-hover: #6a48e8;
  --accent-bg: rgba(124,92,252,0.12);
  --success: #34d399;
  --success-bg: rgba(52,211,153,0.12);
  --warning: #fbbf24;
  --warning-bg: rgba(251,191,36,0.12);
  --danger: #f87171;
  --danger-bg: rgba(248,113,113,0.12);
  --info: #60a5fa;
  --info-bg: rgba(96,165,250,0.12);
  --obsidian: #a855f7;
  --obsidian-bg: rgba(168,85,247,0.12);
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 8px;
  --radius-lg: 12px;
  --sidebar-width: 260px;
  --header-height: 56px;
  --transition: 0.2s ease;
}

[data-theme="light"] {
  --bg-primary: #f5f5f7;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0f0f4;
  --bg-card: #ffffff;
  --bg-hover: #f0f0f4;
  --bg-input: #f0f0f4;
  --border-color: #e0e0e6;
  --border-light: #d0d0d8;
  --text-primary: #1a1a2e;
  --text-secondary: #5a5a70;
  --text-muted: #9898a8;
  --accent: #6c4ce0;
  --accent-hover: #5a38cc;
  --accent-bg: rgba(108,76,224,0.08);
  --success-bg: rgba(52,211,153,0.08);
  --warning-bg: rgba(251,191,36,0.08);
  --danger-bg: rgba(248,113,113,0.08);
  --info-bg: rgba(96,165,250,0.08);
  --obsidian-bg: rgba(168,85,247,0.08);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
}

/* ======================================================
   RESET & BASE
   ====================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
input, textarea, select {
  font-family: inherit;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color var(--transition);
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}

/* ======================================================
   LAYOUT
   ====================================================== */
.app-layout {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  z-index: 100;
}
.sidebar-logo {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
}
.sidebar-logo .logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-nav {
  flex: 1;
  padding: 12px 0;
  overflow-y: auto;
}
.nav-section-title {
  padding: 8px 20px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid transparent;
  position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  color: var(--accent);
  background: var(--accent-bg);
  border-left-color: var(--accent);
  font-weight: 600;
}
.nav-item.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.nav-item.disabled:hover { background: transparent; color: var(--text-secondary); }
.nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-tertiary);
  color: var(--text-muted);
}
.nav-badge.coming { background: var(--accent-bg); color: var(--accent); }

/* MAIN */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* HEADER */
.header {
  height: var(--header-height);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}
.hamburger {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border-radius: var(--radius);
}
.hamburger:hover { background: var(--bg-hover); }
.header-title {
  font-size: 15px;
  font-weight: 600;
  flex: 1;
}
.header-datetime {
  font-size: 13px;
  color: var(--text-secondary);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
.header-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius);
  transition: background var(--transition);
  position: relative;
}
.header-btn:hover { background: var(--bg-hover); }
.notification-dot {
  position: absolute;
  top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--danger);
  border-radius: 50%;
}

/* CONTENT */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* ======================================================
   CARDS / COMPONENTS
   ====================================================== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* Summary cards */
.summary-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.summary-icon {
  width: 42px; height: 42px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.summary-icon.purple { background: var(--accent-bg); color: var(--accent); }
.summary-icon.green { background: var(--success-bg); color: var(--success); }
.summary-icon.yellow { background: var(--warning-bg); color: var(--warning); }
.summary-icon.red { background: var(--danger-bg); color: var(--danger); }
.summary-icon.blue { background: var(--info-bg); color: var(--info); }
.summary-icon.obsidian-purple { background: var(--obsidian-bg); color: var(--obsidian); }
.summary-value { font-size: 28px; font-weight: 700; line-height: 1.1; }
.summary-label { font-size: 13px; color: var(--text-secondary); }
.summary-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Badges / Tags */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-urgent { background: var(--danger-bg); color: var(--danger); }
.badge-high { background: var(--warning-bg); color: var(--warning); }
.badge-normal { background: var(--info-bg); color: var(--info); }
.badge-low { background: var(--bg-tertiary); color: var(--text-muted); }
.badge-pending { background: var(--bg-tertiary); color: var(--text-muted); }
.badge-inprogress { background: var(--accent-bg); color: var(--accent); }
.badge-done { background: var(--success-bg); color: var(--success); }
.badge-hold { background: var(--warning-bg); color: var(--warning); }
.badge-category {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-weight: 500;
}
.badge-obsidian { background: var(--obsidian-bg); color: var(--obsidian); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-light); }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-obsidian { background: var(--obsidian-bg); color: var(--obsidian); border: 1px solid rgba(168,85,247,0.3); }
.btn-obsidian:hover { background: var(--obsidian); color: #fff; }

/* Agent status */
.agent-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color);
}
.agent-row:last-child { border-bottom: none; }
.agent-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.agent-dot.active { background: var(--success); box-shadow: 0 0 6px var(--success); }
.agent-dot.inactive { background: var(--text-muted); }
.agent-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.agent-name { font-size: 13px; font-weight: 500; flex: 1; }
.agent-time { font-size: 12px; color: var(--text-muted); }
.agent-row:hover { background: var(--bg-hover); }

/* Agent registry cards */
.agent-card { padding: 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); }
.agent-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-light); }
.agent-group + .agent-group { margin-top: 8px; }

/* Command input */
.command-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 6px 6px 6px 16px;
  transition: border-color var(--transition);
}
.command-input-wrap:focus-within { border-color: var(--accent); }
.command-input-wrap input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  padding: 8px 0;
}
.command-input-wrap .btn { flex-shrink: 0; }

/* Placeholder overlay */
.coming-soon-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: var(--text-muted);
  text-align: center;
}
.coming-soon-overlay i { margin-bottom: 12px; opacity: 0.4; }

/* ======================================================
   TODO MODULE
   ====================================================== */
.todo-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.todo-toolbar .search-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 0 10px;
  flex: 1;
  min-width: 180px;
  max-width: 320px;
}
.todo-toolbar .search-wrap input {
  border: none;
  background: transparent;
  padding: 7px 0;
  min-width: 0;
  flex: 1;
}
.view-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg-tertiary);
  border-radius: var(--radius);
  padding: 2px;
}
.view-tab {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 6px;
  transition: all var(--transition);
  display: flex; align-items: center; gap: 5px;
}
.view-tab.active { background: var(--accent); color: #fff; }
.view-tab:not(.active):hover { background: var(--bg-hover); }
.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-group select {
  padding: 6px 10px;
  font-size: 12px;
}

/* Stats bar */
.todo-stats {
  display: flex;
  gap: 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-secondary);
}
.stat-item .stat-val { font-weight: 700; color: var(--text-primary); }

/* LIST VIEW */
.todo-list-view .todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all var(--transition);
}
.todo-item:hover { border-color: var(--border-light); background: var(--bg-hover); }
.todo-checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--border-light);
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  cursor: pointer;
}
.todo-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}
.todo-checkbox.checked::after {
  content: '\2713';
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}
.todo-info { flex: 1; min-width: 0; }
.todo-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.todo-title.done { text-decoration: line-through; color: var(--text-muted); }
.todo-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.todo-due {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.todo-due.overdue { color: var(--danger); }
.todo-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.todo-tag {
  font-size: 10px;
  padding: 1px 6px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  color: var(--text-muted);
}
.todo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--transition);
}
.todo-item:hover .todo-actions { opacity: 1; }
.todo-action-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--text-muted);
}
.todo-action-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

/* KANBAN VIEW */
.kanban-board {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 16px;
  min-height: 400px;
}
.kanban-column {
  min-width: 280px;
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-tertiary);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 240px);
}
.kanban-column-header {
  padding: 14px 16px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-color);
}
.kanban-count {
  font-size: 11px;
  background: var(--bg-hover);
  padding: 1px 8px;
  border-radius: 10px;
  color: var(--text-muted);
  font-weight: 400;
}
.kanban-cards {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  min-height: 60px;
}
.kanban-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: box-shadow var(--transition);
}
.kanban-card:hover { box-shadow: var(--shadow-lg); }
.kanban-card .todo-title { font-size: 13px; margin-bottom: 6px; white-space: normal; }
.kanban-card .todo-meta { margin-top: 6px; }
.kanban-card.sortable-ghost { opacity: 0.4; }

/* WEEKLY VIEW */
.weekly-view {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}
.week-day {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  min-height: 200px;
  display: flex;
  flex-direction: column;
}
.week-day-header {
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  border-bottom: 1px solid var(--border-color);
  text-align: center;
}
.week-day-header.today { color: var(--accent); background: var(--accent-bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.week-day-items {
  padding: 8px;
  flex: 1;
  overflow-y: auto;
}
.week-todo-item {
  padding: 6px 8px;
  font-size: 12px;
  background: var(--bg-tertiary);
  border-radius: 6px;
  margin-bottom: 4px;
  cursor: pointer;
  border-left: 3px solid var(--border-color);
}
.week-todo-item.priority-urgent { border-left-color: var(--danger); }
.week-todo-item.priority-high { border-left-color: var(--warning); }
.week-todo-item.priority-normal { border-left-color: var(--info); }
.week-todo-item.priority-low { border-left-color: var(--text-muted); }

/* ======================================================
   OBSIDIAN INTEGRATION
   ====================================================== */
.obsidian-status-bar {
  padding: 10px 20px;
  border-top: 1px solid var(--border-color);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.obsidian-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.obsidian-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.obsidian-dot.connected { background: var(--obsidian); box-shadow: 0 0 6px var(--obsidian); }
.obsidian-dot.disconnected { background: var(--text-muted); }
.obsidian-status-text {
  flex: 1;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.obsidian-status-text.connected { color: var(--obsidian); }

.data-source-toggle {
  display: flex;
  gap: 2px;
  background: var(--bg-tertiary);
  border-radius: var(--radius);
  padding: 2px;
}
.data-source-btn {
  padding: 5px 12px;
  font-size: 12px;
  border-radius: 6px;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.data-source-btn.active { background: var(--accent); color: #fff; }
.data-source-btn.active.obsidian-active { background: var(--obsidian); }
.data-source-btn:not(.active):hover { background: var(--bg-hover); }

.obsidian-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--obsidian-bg);
  border: 1px solid rgba(168,85,247,0.2);
  border-radius: var(--radius);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.obsidian-toolbar select {
  padding: 5px 10px;
  font-size: 12px;
  min-width: 200px;
  background: var(--bg-input);
}
.obsidian-toolbar .sync-info {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
}
.obsidian-section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--obsidian);
  padding: 6px 0 2px;
  margin-top: 8px;

<script>
/* ==============================================================
   OBSIDIAN SYNC MODULE
   ──────────────────────────────────────────────────────────────
   File System Access API를 사용한 단방향(읽기 전용) Obsidian 연동
   ============================================================== */
const ObsidianSync = {
  DB_NAME: 'agent_workbench_obsidian',
  DB_STORE: 'handles',
  HANDLE_KEY: 'vault_handle',
  TODO_PATH: ['02.Area', 'B. 일정관리', 'To do list'],

  _dirHandle: null,
  _connected: false,
  _lastSync: null,
  _weekFiles: [],      // [{name, dateRange, period, status, sortKey}]
  _selectedWeek: null,  // filename
  _cachedTodos: [],     // parsed todos for selected week
  _allWeekTodos: {},    // filename -> todos cache
  _agentResults: [],    // [{agentId, file, folder, frontmatter, mtime, preview, fullPath}]
  _agentResultsScanAt: null,

  get isSupported() {
    return 'showDirectoryPicker' in window;
  },

  get isConnected() {
    return this._connected && this._dirHandle;
  },

  // ── IndexedDB helpers ──
  async _openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(this.DB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async _saveHandle(handle) {
    const db = await this._openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.DB_STORE, 'readwrite');
      tx.objectStore(this.DB_STORE).put(handle, this.HANDLE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  async _loadHandle() {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(this.DB_STORE, 'readonly');
        const req = tx.objectStore(this.DB_STORE).get(this.HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    } catch { return null; }
  },

  async _clearHandle() {
    try {
      const db = await this._openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(this.DB_STORE, 'readwrite');
        tx.objectStore(this.DB_STORE).delete(this.HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    } catch {}
  },

  // ── Connect / Disconnect ──
  async connect() {
    if (!this.isSupported) {
      alert('이 브라우저는 File System Access API를 지원하지 않습니다.\nChrome 또는 Edge를 사용해주세요.');
      return;
    }
    try {
      this._dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      await this._saveHandle(this._dirHandle);
      this._connected = true;
      await this.sync();
      this._updateStatusUI();
      // Auto-switch to obsidian source
      if (todoDataSource !== 'obsidian') {
        todoDataSource = 'obsidian';
        localStorage.setItem('agent_wb_data_source', 'obsidian');
      }
      renderPage();
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Obsidian connect error:', err);
        alert('폴더 연결에 실패했습니다: ' + err.message);
      }
    }
  },

  async tryAutoConnect() {
    if (!this.isSupported) return;
    const handle = await this._loadHandle();
    if (!handle) return;
    try {
      // Verify permission
      const perm = await handle.queryPermission({ mode: 'read' });
      if (perm === 'granted') {
        this._dirHandle = handle;
        this._connected = true;
        await this.sync();
        this._updateStatusUI();
        return;
      }
      // Try requesting permission (will only work with user gesture)
      const req = await handle.requestPermission({ mode: 'read' });
      if (req === 'granted') {
        this._dirHandle = handle;
        this._connected = true;
        await this.sync();
        this._updateStatusUI();
      }
    } catch (err) {
      console.log('Auto-connect failed (expected on page load):', err.message);
      // Save the handle so user can re-grant with a click
      this._dirHandle = handle;
      this._connected = false;
      this._updateStatusUI();
    }
  },

  async reconnect() {
    // Re-request permission on the saved handle (requires user gesture)
    if (this._dirHandle && !this._connected) {
      try {
        const perm = await this._dirHandle.requestPermission({ mode: 'read' });
        if (perm === 'granted') {
          this._connected = true;
          await this.sync();
          this._updateStatusUI();
          renderPage();
        }
      } catch (err) {
        // If this fails, do a fresh connect
        await this.connect();
      }
    } else if (!this._dirHandle) {
      await this.connect();
    } else {
      await this.sync();
      renderPage();
    }
  },

  async disconnect() {
    this._dirHandle = null;
    this._connected = false;
    this._weekFiles = [];
    this._selectedWeek = null;
    this._cachedTodos = [];
    this._allWeekTodos = {};
    this._lastSync = null;
    await this._clearHandle();
    this._updateStatusUI();
    if (todoDataSource === 'obsidian') {
      todoDataSource = 'local';
      localStorage.setItem('agent_wb_data_source', 'local');
    }
    renderPage();
  },

  // ── Navigate to todo folder ──
  async _getTodoFolder() {
    let dir = this._dirHandle;
    for (const segment of this.TODO_PATH) {
      try {
        dir = await dir.getDirectoryHandle(segment);
      } catch {
        throw new Error(`폴더를 찾을 수 없습니다: ${this.TODO_PATH.join('/')}/${segment}`);
      }
    }
    return dir;
  },

  // ── Sync: read all week files ──
  async sync() {
    if (!this.isConnected) return;
    try {
      const todoDir = await this._getTodoFolder();
      const files = [];
      for await (const entry of todoDir.values()) {
        if (entry.kind === 'file' && entry.name.endsWith('.md')) {
          files.push(entry);
        }
      }
      // Parse filenames to extract sort keys
      this._weekFiles = [];
      for (const fh of files) {
        const info = this._parseFileName(fh.name);
        if (info) {
          this._weekFiles.push({ name: fh.name, handle: fh, ...info });
        }
      }
      // Sort newest first
      this._weekFiles.sort((a, b) => b.sortKey.localeCompare(a.sortKey));

      // Auto-select the most relevant week (current or latest)
      if (!this._selectedWeek || !this._weekFiles.find(f => f.name === this._selectedWeek)) {
        this._selectedWeek = this._weekFiles.length > 0 ? this._weekFiles[0].name : null;
      }

      // Read and parse the selected week
      this._allWeekTodos = {};
      if (this._selectedWeek) {
        await this._loadWeekTodos(this._selectedWeek);
      }

      // 에이전트 결과 파일 스캔 (실패해도 todo 동기화는 유지)
      try { await this.scanAgentResults(); }
      catch (err) { console.warn('Agent results scan failed:', err.message); }

      this._lastSync = new Date();
      this._updateStatusUI();
    } catch (err) {
      console.error('Obsidian sync error:', err);
      alert('Obsidian 동기화 실패: ' + err.message);
    }
  },

  /* ============================================================
     에이전트 결과 파일 스캔
     - agents.js의 AGENT_RESULT_DIRS 폴더들을 재귀 순회
     - frontmatter에 `agent: <id>` 가 있는 .md 파일을 결과로 인식
     - 결과는 this._agentResults 에 저장 (created 내림차순)
     ============================================================ */
  async scanAgentResults() {
    if (!this.isConnected) return;
    const dirs = (typeof window !== 'undefined' && window.AGENT_RESULT_DIRS) || [];
    if (!dirs.length) { this._agentResults = []; return; }

    const results = [];
    for (const dirPath of dirs) {
      try { await this._scanDirForResults(dirPath, results, 0); }
      catch (err) { /* 폴더 없음 — skip */ }
    }
    // created (frontmatter) → mtime 순으로 내림차순 정렬
    results.sort((a, b) => {
      const ad = a.frontmatter.created || a.mtime || '';
      const bd = b.frontmatter.created || b.mtime || '';
      return String(bd).localeCompare(String(ad));
    });
    this._agentResults = results;
    this._agentResultsScanAt = new Date();
  },

  async _scanDirForResults(pathStr, accumulator, depth) {
    if (depth > 3) return;  // recursion limit
    const segments = pathStr.split('/').filter(Boolean);
    let dir = this._dirHandle;
    for (const seg of segments) {
      try { dir = await dir.getDirectoryHandle(seg); }
      catch { return; }  // missing folder — silently skip
    }
    for await (const entry of dir.values()) {
      if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.md')) {
        try {
          const file = await entry.getFile();
          const content = await file.text();
          const fm = this._parseFrontmatter(content);
          if (fm.agent) {
            accumulator.push({
              agentId: String(fm.agent).trim(),
              file: entry.name,
              folder: pathStr,
              fullPath: pathStr + entry.name,
              frontmatter: fm,
              mtime: file.lastModified ? new Date(file.lastModified).toISOString().slice(0, 10) : null,
              size: file.size,
              preview: this._extractAgentPreview(content)
            });
          }
        } catch (err) { /* skip unreadable file */ }
      } else if (entry.kind === 'directory') {
        await this._scanDirForResults(pathStr + entry.name + '/', accumulator, depth + 1);
      }
    }
  },

  _extractAgentPreview(content, maxLen = 200) {
    const body = content.replace(/^---[\s\S]*?---\n?/, '').trim();
    const text = body
      .replace(/^#+\s*/gm, '')                    // strip headers
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')   // unwrap markdown links
      .replace(/[*_`>]/g, '')                    // strip emphasis chars
      .replace(/\n+/g, ' ')                      // collapse newlines
      .replace(/\s{2,}/g, ' ')
      .trim();
    return text.slice(0, maxLen) + (text.length > maxLen ? '…' : '');
  },

  getAgentResults(agentId, limit = 5) {
    return (this._agentResults || []).filter(r => r.agentId === agentId).slice(0, limit);
  },

  getAllAgentResults(limit = 10) {
    return (this._agentResults || []).slice(0, limit);
  },

  async _loadWeekTodos(filename) {
    if (this._allWeekTodos[filename]) {
      this._cachedTodos = this._allWeekTodos[filename];
      return;
    }
    const wf = this._weekFiles.find(f => f.name === filename);
    if (!wf) return;
    try {
      const file = await wf.handle.getFile();
      const content = await file.text();
      const todos = this._parseMarkdown(content, filename);
      this._allWeekTodos[filename] = todos;
      this._cachedTodos = todos;
    } catch (err) {
      console.error('Failed to read file:', filename, err);
      this._cachedTodos = [];
    }
  },

  async selectWeek(filename) {
    this._selectedWeek = filename;
    await this._loadWeekTodos(filename);
    renderPage();
  },

  // ── Filename parser ──
  // Pattern: (YYYY.MM) N째주.md
  _parseFileName(name) {
    // Match patterns like "(2026.05) 첫째주.md" or "(2026.04) 넷째주.md"
    const m = name.match(/^\((\d{4})\.(\d{2})\)\s*(.+?)\.md$/);
    if (!m) return null;
    const year = m[1], month = m[2], weekLabel = m[3].trim();
    const weekOrder = { '첫째주':1, '둘째주':2, '셋째주':3, '넷째주':4, '다섯째주':5, '1째주':1, '2째주':2, '3째주':3, '4째주':4, '5째주':5 };
    const wn = weekOrder[weekLabel] || 0;
    return {
      year, month, weekLabel,
      sortKey: `${year}-${month}-${String(wn).padStart(2,'0')}`,
      displayName: `${year}년 ${parseInt(month)}월 ${weekLabel}`
    };
  },

  // ── Markdown parser ──
  _parseMarkdown(content, filename) {
    const todos = [];
    const frontmatter = this._parseFrontmatter(content);
    const body = content.replace(/^---[\s\S]*?---\n?/, '');

    // Detect format: new (### headers) or old (<category> tags)
    const hasNewFormat = /^###?\s+/m.test(body);
    const hasOldFormat = /<[^>]+>/.test(body);

    let currentCategory = '기타';
    let currentSection = ''; // Track sections like "Top 3", "이월 항목", "완료"
    const lines = body.split('\n');

    for (const line of lines) {
      // New format: ## or ### headers for sections/categories
      const h2Match = line.match(/^##\s+(.+)/);
      if (h2Match) {
        const raw = h2Match[1].replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
        currentSection = raw;
        // Map known section names
        if (raw.includes('카테고리')) currentSection = 'categories';
        else if (raw.includes('이월')) currentSection = '이월';
        else if (raw.includes('완료')) currentSection = '완료';
        else if (raw.includes('회고')) currentSection = '회고';
        continue;
      }

      const h3Match = line.match(/^###\s+(.+)/);
      if (h3Match) {
        // Extract category from ### header like "### 🏢 업무 #KRRI"
        const raw = h3Match[1].replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
        // Remove leading emoji leftovers and #tags at the end for category name
        currentCategory = raw.replace(/#\S+/g, '').trim() || '기타';
        continue;
      }

      // Old format: <카테고리명> tags
      const oldCatMatch = line.match(/^<([^>]+)>/);
      if (oldCatMatch) {
        currentCategory = oldCatMatch[1].trim();
        currentSection = '';
        continue;
      }

      // # Top 3 header
      const h1Match = line.match(/^#\s+(.+)/);
      if (h1Match) {
        const raw = h1Match[1].replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
        if (raw.toLowerCase().includes('top')) {
          currentSection = 'top3';
          currentCategory = 'Top 3';
        }
        continue;
      }

      // Checkbox lines
      const cbMatch = line.match(/^[-*]\s+\[([ xX])\]\s+(.+)/);
      if (!cbMatch) continue;

      const isDone = cbMatch[1].toLowerCase() === 'x';
      let text = cbMatch[2].trim();

      // Parse Obsidian Tasks syntax
      let dueDate = null;
      let priority = '보통';
      const tags = [];

      // Due date: 📅 YYYY-MM-DD
      const dueMatch = text.match(/\u{1F4C5}\s*(\d{4}-\d{2}-\d{2})/u);
      if (dueMatch) {
        dueDate = dueMatch[1];
        text = text.replace(dueMatch[0], '').trim();
      }

      // Priority emojis: ⏫ high, 🔼 medium, 🔽 low
      if (text.includes('\u23EB')) { priority = '높음'; text = text.replace('\u23EB', '').trim(); }  // ⏫
      else if (text.includes('\u{1F53C}')) { priority = '보통'; text = text.replace('\u{1F53C}', '').trim(); }  // 🔼
      else if (text.includes('\u{1F53D}')) { priority = '낮음'; text = text.replace('\u{1F53D}', '').trim(); }  // 🔽

      // Extract #tags
      const tagMatches = text.matchAll(/#(\S+)/g);
      for (const tm of tagMatches) {
        tags.push(tm[1]);
      }
      text = text.replace(/#\S+/g, '').trim();

      // Clean up any remaining emojis used as decoration
      text = text.replace(/\s{2,}/g, ' ').trim();

      // Determine effective category
      let effectiveCategory = currentCategory;
      if (currentSection === 'top3') effectiveCategory = 'Top 3';
      else if (currentSection === '이월') effectiveCategory = '이월';
      else if (currentSection === '완료') effectiveCategory = '완료';

      // Determine status
      let status;
      if (isDone) status = '완료';
      else if (currentSection === '완료') status = '완료';
      else status = '대기';

      const todo = {
        id: 'obs_' + genId(),
        title: text,
        description: '',
        category: effectiveCategory,
        priority,
        status,
        dueDate,
        createdAt: frontmatter.created || null,
        completedAt: isDone ? (frontmatter.created || new Date().toISOString().split('T')[0]) : null,
        tags,
        recurring: false,
        memo: '',
        _source: 'obsidian',
        _file: filename,
        _section: currentSection,
        _period: frontmatter.period || '',
        _dateRange: frontmatter.date_range || ''
      };
      todos.push(todo);
    }
    return todos;
  },

  _parseFrontmatter(content) {
    const m = content.match(/^---\n([\s\S]*?)\n---/);
    if (!m) return {};
    const fm = {};
    const lines = m[1].split('\n');
    for (const line of lines) {
      const kv = line.match(/^(\w[\w_-]*):\s*(.+)/);
      if (kv) {
        let val = kv[2].trim();
        // Remove quotes
        if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
          val = val.slice(1, -1);
        }
        // Handle arrays like [tag1, tag2]
        if (val.startsWith('[') && val.endsWith(']')) {
          val = val.slice(1, -1).split(',').map(s => s.trim().replace(/['"]/g, ''));
        }
        fm[kv[1]] = val;
      }
    }
    return fm;
  },

  // ── Get todos for current view ──
  getTodos() {
    return this._cachedTodos || [];
  },

  // ── UI Updates ──
  _updateStatusUI() {
    const dot = document.getElementById('obsidianDot');
    const text = document.getElementById('obsidianStatusText');
    const btnLabel = document.getElementById('obsidianBtnLabel');
    const btn = document.getElementById('obsidianConnectBtn');

    if (this._connected) {
      dot.className = 'obsidian-dot connected';
      text.className = 'obsidian-status-text connected';
      const syncTime = this._lastSync ? `${this._lastSync.getHours().toString().padStart(2,'0')}:${this._lastSync.getMinutes().toString().padStart(2,'0')}` : '';
      text.textContent = `연결됨 · ${this._weekFiles.length}개 파일`;
      if (syncTime) text.title = `마지막 동기화: ${syncTime}`;
      btnLabel.textContent = '연결 해제';
      btn.onclick = () => ObsidianSync.disconnect();
    } else if (this._dirHandle) {
      // Have handle but no permission
      dot.className = 'obsidian-dot disconnected';
      text.className = 'obsidian-status-text';
      text.textContent = '권한 재요청 필요';
      btnLabel.textContent = '다시 연결';
      btn.onclick = () => ObsidianSync.reconnect();
    } else {
      dot.className = 'obsidian-dot disconnected';
      text.className = 'obsidian-status-text';
      text.textContent = 'Obsidian 미연결';
      btnLabel.textContent = '볼트 연결';
      btn.onclick = () => ObsidianSync.connect();
    }
    lucide.createIcons();
  }
};

const DataLayer = {
  STORAGE_KEY: 'agent_workbench_todos',

  getAll() {
    try {
      const data = localStorage.getItem(this.STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch { return []; }
  },

  saveAll(todos) {
    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(todos));
  },

  get(id) {
    return this.getAll().find(t => t.id === id);
  },

  save(todo) {
    const todos = this.getAll();
    const idx = todos.findIndex(t => t.id === todo.id);
    if (idx >= 0) todos[idx] = todo;
    else todos.push(todo);
    this.saveAll(todos);
  },

  delete(id) {
    this.saveAll(this.getAll().filter(t => t.id !== id));
  },

  clearAll() {
    localStorage.removeItem(this.STORAGE_KEY);
  },

  exportJSON() {
    return JSON.stringify(this.getAll(), null, 2);
  },

  importJSON(json) {
    const data = JSON.parse(json);
    if (Array.isArray(data)) this.saveAll(data);
  },

  loadSample() {
    this.saveAll(SAMPLE_DATA);
  }
};

/* ==============================================================
   UTILITY
   ============================================================== */
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function formatDate(str) {
  if (!str) return '';
  const d = new Date(str);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function isOverdue(dueDate, status) {
  if (!dueDate || status === '완료') return false;
  return new Date(dueDate) < new Date(fmt(today));
}

function priorityClass(p) {
  return { '긴급':'badge-urgent','높음':'badge-high','보통':'badge-normal','낮음':'badge-low' }[p] || 'badge-low';
}
function statusClass(s) {
  return { '대기':'badge-pending','진행중':'badge-inprogress','완료':'badge-done','보류':'badge-hold' }[s] || 'badge-pending';
}

    el.classList.toggle('active', el.dataset.page === page);

  const titles = { home:'개요', todo:'할 일', agents:'에이전트' };
  document.getElementById('pageTitle').textContent = titles[page] || '';

function handleCommand() {
  const input = document.getElementById('quickCommand');
  const text = (input.value || '').trim();
  if (!text) return;

  // 키워드 기반 에이전트 매칭 (간단한 규칙)
  const rules = [
    { keys:['브리핑','briefing','포트폴리오','오늘 시장','주간 시장'], id:'portfolio-brief' },
    { keys:['종목 분석','분석해','tier','티어','can slim','vcp'],     id:'investment-analyzer' },
    { keys:['논문','paper','초안','abstract','introduction'],          id:'paper-writer' },
    { keys:['자료조사','조사해','리서치','선행연구','review'],          id:'research-collector' },
    { keys:['시뮬레이션','sfm','digital twin','디지털 트윈'],          id:'simulation-research' },
    { keys:['기획서','과제 기획','rfp','제안'],                        id:'proposal-writer' },
    { keys:['발표','슬라이드','deck','pptx','프레젠테이션'],            id:'presentation-builder' },
    { keys:['주간 보고','업무 보고','일일 보고','월간 보고'],            id:'work-report-writer' },
    { keys:['실적','cv','커리어','갭 분석'],                            id:'performance-tracker' }
  ];
  const lower = text.toLowerCase();
  let matched = null;
  for (const r of rules) {
    if (r.keys.some(k => lower.includes(k.toLowerCase()))) { matched = r.id; break; }
  }

  if (matched && typeof AgentModule !== 'undefined') {
    navigate('agents');
    setTimeout(() => AgentModule.openModal(matched), 80);
  } else {
    // 에이전트 페이지로 이동만
    navigate('agents');
    AgentModule._toast?.(`'${text}'에 정확히 매칭되는 에이전트를 못 찾았어요. 카드에서 선택해주세요.`);
  }
  input.value = '';
}

/* ==============================================================
   TODO MODULE
   ============================================================== */
const TodoModule = {
  init() {
    if (todoView === 'kanban' && todoDataSource === 'local') this.initKanban();
  },

  reload() {
    if (currentPage === 'todo') renderPage();
  },

  getFiltered() {
    let todos = (todoDataSource === 'obsidian' && ObsidianSync.isConnected) ? ObsidianSync.getTodos() : DataLayer.getAll();
    const f = todoFilters;
    if (f.category !== 'all') todos = todos.filter(t => t.category === f.category);
    if (f.priority !== 'all') todos = todos.filter(t => t.priority === f.priority);
    if (f.status !== 'all') todos = todos.filter(t => t.status === f.status);
    if (f.search) {
      const q = f.search.toLowerCase();
      todos = todos.filter(t =>
        t.title.toLowerCase().includes(q) ||
        (t.description||'').toLowerCase().includes(q) ||
        (t.tags||[]).some(tag => tag.toLowerCase().includes(q))
      );
    }
    // Sort
    const priorityOrder = { '긴급':0, '높음':1, '보통':2, '낮음':3 };
    if (todoSort === 'priority') todos.sort((a,b) => (priorityOrder[a.priority]||2) - (priorityOrder[b.priority]||2));
    else if (todoSort === 'dueDate') todos.sort((a,b) => (a.dueDate||'9999') > (b.dueDate||'9999') ? 1 : -1);
    else if (todoSort === 'createdAt') todos.sort((a,b) => (b.createdAt||'') > (a.createdAt||'') ? 1 : -1);
    return todos;
  },

  initKanban() {
    ['대기','진행중','완료','보류'].forEach(status => {
      const el = document.getElementById('kanban-' + status);
      if (!el) return;
      new Sortable(el, {
        group: 'kanban',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: (evt) => {
          const id = evt.item.dataset.id;
          const newStatus = evt.to.dataset.status;
          const todo = DataLayer.get(id);
          if (todo) {
            todo.status = newStatus;
            if (newStatus === '완료' && !todo.completedAt) todo.completedAt = new Date().toISOString();
            if (newStatus !== '완료') todo.completedAt = null;
            DataLayer.save(todo);
            renderPage();
          }
        }
      });
    });
  }
};

function renderTodo() {
  const isObs = todoDataSource === 'obsidian';
  const obsConnected = ObsidianSync.isConnected;
  const todos = TodoModule.getFiltered();
  const allTodos = isObs && obsConnected ? ObsidianSync.getTodos() : DataLayer.getAll();

  // Stats
  const todayStr = fmt(today);
  const weekStart = new Date(today); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth()+1, 0);

  function completionRate(filter) {
    const subset = allTodos.filter(filter);
    if (!subset.length) return '—';
    const done = subset.filter(t => t.status === '완료').length;
    return Math.round(done/subset.length*100) + '%';
  }
  const todayRate = completionRate(t => t.dueDate === todayStr);
  const weekRate = isObs && obsConnected
    ? completionRate(() => true) // For obsidian, show overall rate for the week file
    : completionRate(t => t.dueDate && new Date(t.dueDate) >= weekStart && new Date(t.dueDate) <= weekEnd);
  const monthRate = isObs && obsConnected
    ? '—'
    : completionRate(t => t.dueDate && new Date(t.dueDate) >= monthStart && new Date(t.dueDate) <= monthEnd);

  let viewContent = '';
  if (todoView === 'list') viewContent = renderListView(todos, isObs && obsConnected);
  else if (todoView === 'kanban') viewContent = renderKanbanView(todos, isObs && obsConnected);
  else if (todoView === 'weekly') viewContent = renderWeeklyView(todos);

      `<option value="${escHtml(f.name)}" ${f.name === ObsidianSync._selectedWeek ? 'selected' : ''}>${escHtml(f.displayName)}</option>`
    ).join('');
    const syncTime = ObsidianSync._lastSync
      ? `${ObsidianSync._lastSync.getHours().toString().padStart(2,'0')}:${ObsidianSync._lastSync.getMinutes().toString().padStart(2,'0')}`
      : '—';
    obsidianToolbar = `
      <div class="obsidian-toolbar">
        <i data-lucide="book-marked" style="width:14px;height:14px;color:var(--obsidian);flex-shrink:0"></i>
        <select onchange="ObsidianSync.selectWeek(this.value)" style="min-width:180px">

          <i data-lucide="refresh-cw" style="width:13px;height:13px"></i> 동기화
        </button>
        <span class="sync-info">마지막: ${syncTime}</span>
      </div>`;
  } else if (isObs && !obsConnected) {
    obsidianToolbar = `
      <div class="obsidian-toolbar" style="justify-content:center">
        <span style="color:var(--text-muted);font-size:13px">Obsidian 볼트가 연결되지 않았습니다.</span>
        <button class="btn btn-obsidian btn-sm" onclick="ObsidianSync.connect()">
          <i data-lucide="link" style="width:12px;height:12px"></i> 볼트 연결

      ${dataSourceToggle}

        <i data-lucide="search" style="width:14px;height:14px;color:var(--text-muted);flex-shrink:0"></i>
        <input type="text" placeholder="검색..." value="${todoFilters.search}" oninput="todoFilters.search=this.value;renderPage()">
      </div>

      <div class="view-tabs">
        <button class="view-tab ${todoView==='list'?'active':''}" onclick="todoView='list';renderPage()">
          <i data-lucide="list" style="width:14px;height:14px"></i> 리스트
        </button>
        <button class="view-tab ${todoView==='kanban'?'active':''}" onclick="todoView='kanban';renderPage()">
          <i data-lucide="columns" style="width:14px;height:14px"></i> 칸반
        </button>
        <button class="view-tab ${todoView==='weekly'?'active':''}" onclick="todoView='weekly';renderPage()">
          <i data-lucide="calendar-days" style="width:14px;height:14px"></i> 주간
        </button>
      </div>

      <div class="filter-group">
        <select onchange="todoFilters.category=this.value;renderPage()">
          <option value="all" ${todoFilters.category==='all'?'selected':''}>전체 카테고리</option>
          ${categories.map(c => `<option value="${escHtml(c)}" ${todoFilters.category===c?'selected':''}>${escHtml(c)}</option>`).join('')}
        </select>
        <select onchange="todoFilters.priority=this.value;renderPage()">
          <option value="all" ${todoFilters.priority==='all'?'selected':''}>전체 우선순위</option>

          <option value="높음" ${todoFilters.priority==='높음'?'selected':''}>높음</option>
          <option value="보통" ${todoFilters.priority==='보통'?'selected':''}>보통</option>
          <option value="낮음" ${todoFilters.priority==='낮음'?'selected':''}>낮음</option>
        </select>
        <select onchange="todoFilters.status=this.value;renderPage()">
          <option value="all" ${todoFilters.status==='all'?'selected':''}>전체 상태</option>
          <option value="대기" ${todoFilters.status==='대기'?'selected':''}>대기</option>
          <option value="진행중" ${todoFilters.status==='진행중'?'selected':''}>진행중</option>
          <option value="완료" ${todoFilters.status==='완료'?'selected':''}>완료</option>
          <option value="보류" ${todoFilters.status==='보류'?'selected':''}>보류</option>
        </select>
        <select onchange="todoSort=this.value;renderPage()">
          <option value="dueDate" ${todoSort==='dueDate'?'selected':''}>마감일순</option>
          <option value="priority" ${todoSort==='priority'?'selected':''}>우선순위순</option>
          <option value="createdAt" ${todoSort==='createdAt'?'selected':''}>생성일순</option>
        </select>
      </div>

      ${!isObs ? `<button class="btn btn-primary" onclick="openTodoModal()">
        <i data-lucide="plus" style="width:14px;height:14px"></i> 추가
      </button>` : ''}
    </div>

    ${obsidianToolbar}

    <!-- Stats -->
    <div class="todo-stats">
      <div class="stat-item">오늘 <span class="stat-val">${todayRate}</span></div>
      <div class="stat-item">${isObs && obsConnected ? '이 주간' : '이번 주'} <span class="stat-val">${weekRate}</span></div>
      ${!isObs ? `<div class="stat-item">이번 달 <span class="stat-val">${monthRate}</span></div>` : ''}
      <div class="stat-item">전체 <span class="stat-val">${todos.length}건</span></div>
      ${isObs && obsConnected ? `<div class="stat-item" style="color:var(--obsidian)"><i data-lucide="book-marked" style="width:12px;height:12px"></i> Obsidian</div>` : ''}
    </div>

    ${viewContent}
  </div>`;
}

function renderListView(todos, isObsidian) {
  if (!todos.length) return '<div class="coming-soon-overlay"><i data-lucide="inbox" style="width:40px;height:40px"></i><p>할 일이 없습니다</p></div>';

  if (isObsidian) {
    // Group by category for obsidian view
    const grouped = {};
    todos.forEach(t => {
      const cat = t.category || '기타';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(t);
    });
    // Order categories: Top 3 first, then others, then 이월, 완료 last
    const catOrder = ['Top 3', '업무', '연구', '자기개발', '개인', '이월', '완료'];
    const sortedCats = Object.keys(grouped).sort((a, b) => {
      const ai = catOrder.indexOf(a), bi = catOrder.indexOf(b);
      return (ai === -1 ? 50 : ai) - (bi === -1 ? 50 : bi);
    });

    return `<div class="todo-list-view">
      ${sortedCats.map(cat => `
        <div class="obsidian-section-label">${escHtml(cat)} (${grouped[cat].length})</div>
        ${grouped[cat].map(t => renderObsidianTodoItem(t)).join('')}
      `).join('')}
    </div>`;
  }

  return `<div class="todo-list-view">${todos.map(t => `
    <div class="todo-item" ondblclick="openTodoModal('${t.id}')">
      <div class="todo-checkbox ${t.status==='완료'?'checked':''}" onclick="event.stopPropagation();toggleComplete('${t.id}')"></div>
      <div class="todo-info">
        <div class="todo-title ${t.status==='완료'?'done':''}">${escHtml(t.title)}</div>
        <div class="todo-meta">
          <span class="badge ${priorityClass(t.priority)}">${t.priority}</span>
          <span class="badge ${statusClass(t.status)}">${t.status}</span>
          <span class="badge badge-category">${t.category}</span>
          ${t.dueDate ? `<span class="todo-due ${isOverdue(t.dueDate,t.status)?'overdue':''}"><i data-lucide="clock" style="width:11px;height:11px"></i> ${formatDate(t.dueDate)}</span>` : ''}
          ${t.recurring ? '<span class="todo-due"><i data-lucide="repeat" style="width:11px;height:11px"></i></span>' : ''}
          <div class="todo-tags">${(t.tags||[]).map(tag => `<span class="todo-tag">${escHtml(tag)}</span>`).join('')}</div>
        </div>
      </div>
      <div class="todo-actions">
        <button class="todo-action-btn" onclick="event.stopPropagation();openTodoModal('${t.id}')" title="수정"><i data-lucide="pencil" style="width:14px;height:14px"></i></button>
        <button class="todo-action-btn" onclick="event.stopPropagation();deleteTodo('${t.id}')" title="삭제"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
      </div>
    </div>`).join('')}</div>`;
}

function renderObsidianTodoItem(t) {
  return `
    <div class="todo-item" onclick="showObsidianDetail('${t.id}')">
      <div class="todo-checkbox ${t.status==='완료'?'checked':''}" style="cursor:default"></div>
      <div class="todo-info">
        <div class="todo-title ${t.status==='완료'?'done':''}">${escHtml(t.title)}</div>
        <div class="todo-meta">
          <span class="badge ${priorityClass(t.priority)}">${t.priority}</span>
          ${t.dueDate ? `<span class="todo-due ${isOverdue(t.dueDate,t.status)?'overdue':''}"><i data-lucide="clock" style="width:11px;height:11px"></i> ${formatDate(t.dueDate)}</span>` : ''}
          <div class="todo-tags">${(t.tags||[]).map(tag => `<span class="todo-tag">${escHtml(tag)}</span>`).join('')}</div>
        </div>
      </div>
      <span class="badge badge-obsidian" style="flex-shrink:0">Obsidian</span>
    </div>`;
}

function showObsidianDetail(id) {
  const todos = ObsidianSync.getTodos();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const body = document.getElementById('obsidianDetailBody');
  body.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:18px;font-weight:600;margin-bottom:8px;${t.status==='완료'?'text-decoration:line-through;color:var(--text-muted)':''}">${escHtml(t.title)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge ${priorityClass(t.priority)}">${t.priority}</span>
        <span class="badge ${statusClass(t.status)}">${t.status}</span>
        <span class="badge badge-category">${escHtml(t.category)}</span>
        <span class="badge badge-obsidian">Obsidian</span>
      </div>
    </div>
    ${t.dueDate ? `<div class="form-group"><label>마감일</label><div style="font-size:14px">${t.dueDate}</div></div>` : ''}
    ${t.tags && t.tags.length ? `<div class="form-group"><label>태그</label><div class="todo-tags">${t.tags.map(tag => `<span class="todo-tag" style="font-size:12px;padding:2px 8px">${escHtml(tag)}</span>`).join('')}</div></div>` : ''}
    ${t._period ? `<div class="form-group"><label>기간</label><div style="font-size:14px">${escHtml(t._period)}</div></div>` : ''}
    ${t._dateRange ? `<div class="form-group"><label>날짜 범위</label><div style="font-size:14px">${escHtml(t._dateRange)}</div></div>` : ''}
    ${t._file ? `<div class="form-group"><label>원본 파일</label><div style="font-size:13px;color:var(--text-muted)">${escHtml(t._file)}</div></div>` : ''}
    <div style="margin-top:12px;padding:10px;background:var(--bg-tertiary);border-radius:var(--radius);font-size:12px;color:var(--text-muted)">
      읽기 전용 — Obsidian에서 직접 수정하세요.
    </div>
  `;
  document.getElementById('obsidianDetailModal').classList.add('show');
  lucide.createIcons();
}

function renderKanbanView(allFiltered, isObsidian) {
  const statuses = ['대기','진행중','완료','보류'];
  const colors = { '대기':'var(--text-muted)', '진행중':'var(--accent)', '완료':'var(--success)', '보류':'var(--warning)' };
  return `<div class="kanban-board">${statuses.map(s => {
    const items = allFiltered.filter(t => t.status === s);
    return `
      <div class="kanban-column">
        <div class="kanban-column-header">
          <span style="width:8px;height:8px;border-radius:50%;background:${colors[s]};display:inline-block"></span>
          ${s} <span class="kanban-count">${items.length}</span>
        </div>
        <div class="kanban-cards" id="kanban-${s}" data-status="${s}">
          ${items.map(t => `
            <div class="kanban-card" data-id="${t.id}" ondblclick="${isObsidian ? `showObsidianDetail('${t.id}')` : `openTodoModal('${t.id}')`}">
              <div class="todo-title">${escHtml(t.title)}</div>
              <div class="todo-meta">
                <span class="badge ${priorityClass(t.priority)}">${t.priority}</span>
                <span class="badge badge-category">${t.category}</span>
                ${t.dueDate ? `<span class="todo-due ${isOverdue(t.dueDate,t.status)?'overdue':''}"><i data-lucide="clock" style="width:11px;height:11px"></i> ${formatDate(t.dueDate)}</span>` : ''}
              </div>
              <div class="todo-tags" style="margin-top:6px">${(t.tags||[]).map(tag => `<span class="todo-tag">${escHtml(tag)}</span>`).join('')}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('')}</div>`;
}

function renderWeeklyView(todos) {
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay()); // Sunday
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  const isObs = todoDataSource === 'obsidian' && ObsidianSync.isConnected;
  return `<div class="weekly-view">${days.map(d => {
    const dateStr = fmt(d);
    const isToday = dateStr === fmt(today);
    const dayTodos = todos.filter(t => t.dueDate === dateStr);
    // For obsidian with no due dates, show undated items on today
    const undatedForToday = (isObs && isToday) ? todos.filter(t => !t.dueDate && t.status !== '완료') : [];
    const allDayItems = [...dayTodos, ...(isToday ? undatedForToday : [])];
    // Deduplicate
    const seen = new Set();
    const uniqueItems = allDayItems.filter(t => { if (seen.has(t.id)) return false; seen.add(t.id); return true; });

    return `
      <div class="week-day">
        <div class="week-day-header ${isToday?'today':''}">
          ${DAY_NAMES[d.getDay()]} <span style="font-weight:400;color:var(--text-muted);margin-left:4px">${d.getMonth()+1}/${d.getDate()}</span>
        </div>
        <div class="week-day-items">
          ${uniqueItems.map(t => `
            <div class="week-todo-item priority-${t.priority === '긴급'?'urgent':t.priority==='높음'?'high':t.priority==='보통'?'normal':'low'}"
                 onclick="${isObs ? `showObsidianDetail('${t.id}')` : `openTodoModal('${t.id}')`}"
                 title="${escHtml(t.title)}">
              ${t.status==='완료'?'<s>':''}${escHtml(t.title)}${t.status==='완료'?'</s>':''}
            </div>`).join('')}
          ${uniqueItems.length===0 ? '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px">—</div>' : ''}
        </div>
      </div>`;
  }).join('')}</div>`;
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ==============================================================
   TODO CRUD
   ============================================================== */
function openTodoModal(id) {
  // Obsidian mode: read-only, show detail modal instead
  if (todoDataSource === 'obsidian' && ObsidianSync.isConnected && id && id.startsWith('obs_')) {
    showObsidianDetail(id);
    return;
  }

  const modal = document.getElementById('todoModal');
  document.getElementById('todoModalTitle').textContent = id ? '할 일 수정' : '할 일 추가';
  if (id) {
    const t = DataLayer.get(id);
    if (!t) return;
    document.getElementById('todoId').value = t.id;
    document.getElementById('todoTitleInput').value = t.title;
    document.getElementById('todoDescInput').value = t.description || '';
    document.getElementById('todoCategoryInput').value = t.category;
    document.getElementById('todoPriorityInput').value = t.priority;
    document.getElementById('todoStatusInput').value = t.status;
    document.getElementById('todoDueInput').value = t.dueDate || '';
    document.getElementById('todoTagsInput').value = (t.tags||[]).join(', ');
    document.getElementById('todoMemoInput').value = t.memo || '';
    document.getElementById('todoRepeatInput').checked = !!t.recurring;
  } else {
    document.getElementById('todoId').value = '';
    document.getElementById('todoTitleInput').value = '';
    document.getElementById('todoDescInput').value = '';
    document.getElementById('todoCategoryInput').value = '업무';
    document.getElementById('todoPriorityInput').value = '보통';
    document.getElementById('todoStatusInput').value = '대기';
    document.getElementById('todoDueInput').value = '';
    document.getElementById('todoTagsInput').value = '';
    document.getElementById('todoMemoInput').value = '';
    document.getElementById('todoRepeatInput').checked = false;
  }
  modal.classList.add('show');
  setTimeout(() => document.getElementById('todoTitleInput').focus(), 100);
}

function closeTodoModal() {
  document.getElementById('todoModal').classList.remove('show');
}

function saveTodo() {
  const title = document.getElementById('todoTitleInput').value.trim();
  if (!title) { alert('제목을 입력하세요'); return; }
  const id = document.getElementById('todoId').value || genId();
  const existing = DataLayer.get(id);
  const status = document.getElementById('todoStatusInput').value;

  const todo = {
    id,
    title,
    description: document.getElementById('todoDescInput').value.trim(),
    category: document.getElementById('todoCategoryInput').value,
    priority: document.getElementById('todoPriorityInput').value,
    status,
    dueDate: document.getElementById('todoDueInput').value || null,
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    completedAt: status === '완료' ? (existing?.completedAt || new Date().toISOString()) : null,
    tags: document.getElementById('todoTagsInput').value.split(',').map(s=>s.trim()).filter(Boolean),
    recurring: document.getElementById('todoRepeatInput').checked,
    memo: document.getElementById('todoMemoInput').value.trim()
  };
  DataLayer.save(todo);
  closeTodoModal();
  renderPage();
}

function deleteTodo(id) {
  if (!confirm('이 할 일을 삭제하시겠습니까?')) return;
  DataLayer.delete(id);
  renderPage();
}

function toggleComplete(id) {
  const todo = DataLayer.get(id);
  if (!todo) return;
  if (todo.status === '완료') {
    todo.status = '대기';
    todo.completedAt = null;
  } else {
    todo.status = '완료';
    todo.completedAt = new Date().toISOString();
  }
  DataLayer.save(todo);
  renderPage();
}

function updateTodoBadge() {
  const isObs = todoDataSource === 'obsidian' && ObsidianSync.isConnected;
  const todos = isObs ? ObsidianSync.getTodos() : DataLayer.getAll();
  const active = todos.filter(t => t.status !== '완료').length;
  document.getElementById('todoBadge').textContent = active;
}

/* ==============================================================
   DATA IMPORT / EXPORT
   ============================================================== */
function showDataModal() { document.getElementById('dataModal').classList.add('show'); lucide.createIcons(); }
function closeDataModal() { document.getElementById('dataModal').classList.remove('show'); }

function exportData() {
  const blob = new Blob([DataLayer.exportJSON()], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'agent-workbench-data.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      DataLayer.importJSON(e.target.result);
      renderPage();
      alert('데이터를 성공적으로 가져왔습니다.');
    } catch { alert('올바른 JSON 파일이 아닙니다.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ==============================================================
   INIT
   ============================================================== */
(async function init() {
  // Restore theme
  const savedTheme = localStorage.getItem('agent_wb_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  // Load sample data if empty
  if (DataLayer.getAll().length === 0) DataLayer.loadSample();

  // Render
  updateDateTime();
  setInterval(updateDateTime, 30000);
  renderPage();
  lucide.createIcons();

  // Attempt auto-connect to Obsidian
  await ObsidianSync.tryAutoConnect();
  if (ObsidianSync.isConnected && todoDataSource === 'obsidian') {
    renderPage();
  }
})();
</script>
